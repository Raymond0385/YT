name: Build & Release Multi-Platform Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            os_name: 'Windows'
          - platform: 'macos-14'
            target: 'universal-apple-darwin'
            os_name: 'macOS (Universal: Apple Silicon + Intel Mac)'

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy subtitle fonts and emoji images into the installer resources
        shell: bash
        run: |
          mkdir -p CapShorts/src-tauri/binaries/fonts
          cp CapShorts/frontend/public/fonts/*.ttf CapShorts/src-tauri/binaries/fonts/
          mkdir -p CapShorts/src-tauri/binaries/emoji
          cp CapShorts/backend/emoji/* CapShorts/src-tauri/binaries/emoji/
          cp CapShorts/frontend/src/data/animations.json CapShorts/src-tauri/binaries/animations.json
          mkdir -p CapShorts/src-tauri/binaries/face
          cp CapShorts/backend/face/*.onnx CapShorts/src-tauri/binaries/face/

      - name: Download QuickJS (JavaScript engine used to read YouTube)
        shell: bash
        run: |
          mkdir -p CapShorts/src-tauri/binaries/bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -fsSL -o CapShorts/src-tauri/binaries/bin/qjs.exe "https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-windows-x86_64.exe"
          else
            curl -fsSL -o CapShorts/src-tauri/binaries/bin/qjs "https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-darwin" || echo "QuickJS for macOS not downloaded; YouTube import will use a system Node/Deno if present"
            chmod +x CapShorts/src-tauri/binaries/bin/qjs || true
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r CapShorts/backend/requirements.txt
          pip install "pyinstaller>=6.22" pyinstaller-hooks-contrib

      # Windows: Download portable FFmpeg
      - name: Download & Setup Windows FFmpeg binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "CapShorts/src-tauri/binaries/bin" | Out-Null
          Write-Host "Downloading portable FFmpeg for Windows..."
          $downloadUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $downloadUrl -OutFile "ffmpeg.zip"
          Write-Host ("FFmpeg SHA256: " + (Get-FileHash -Path "ffmpeg.zip" -Algorithm SHA256).Hash.ToLower())
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted" -Force
          $ffmpegPath = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1 -ExpandProperty FullName
          $ffprobePath = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1 -ExpandProperty FullName
          Copy-Item $ffmpegPath "CapShorts/src-tauri/binaries/bin/ffmpeg.exe"
          Copy-Item $ffprobePath "CapShorts/src-tauri/binaries/bin/ffprobe.exe"
          Write-Host "FFmpeg binaries verified and ready in CapShorts/src-tauri/binaries/bin!"

      # macOS: Install portable FFmpeg
      - name: Download & Setup macOS FFmpeg binaries
        if: runner.os == 'macOS'
        run: |
          mkdir -p CapShorts/src-tauri/binaries/bin
          brew install ffmpeg
          cp $(which ffmpeg) CapShorts/src-tauri/binaries/bin/ffmpeg
          cp $(which ffprobe) CapShorts/src-tauri/binaries/bin/ffprobe
          chmod +x CapShorts/src-tauri/binaries/bin/*
          echo "macOS FFmpeg binaries ready in CapShorts/src-tauri/binaries/bin!"

      # Compile Standalone Backend Engine (Windows)
      - name: Compile Backend Engine with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd CapShorts/backend
          pyinstaller --noconfirm --onefile --windowed `
            --name "backend-engine" `
            --hidden-import "uvicorn" `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols" `
            --hidden-import "uvicorn.protocols.http" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.lifespan" `
            --hidden-import "uvicorn.lifespan.on" `
            --hidden-import "engine" `
            --hidden-import "broll" `
            --hidden-import "clip_generator" `
            --hidden-import "clip_scoring" `
            --hidden-import "groq_transcribe" `
            --hidden-import "subtitle_gen" `
            --hidden-import "transliterate" `
            --hidden-import "telemetry" `
            --hidden-import "text_align" `
            --hidden-import "asr_quality" `
            --hidden-import "file_utils" `
            --hidden-import "youtube_download" `
            --hidden-import "groq_chunks" `
            --hidden-import "animation_specs" `
            --hidden-import "emoji_overlay" `
            --hidden-import "reframe" `
            --hidden-import "media_store" `
            --hidden-import "parent_watch" `
            --collect-all "cv2" `
            --collect-submodules "yt_dlp" `
            --collect-all "yt_dlp_ejs" `
            --collect-all "faster_whisper" `
            --collect-all "ctranslate2" `
            --collect-all "onnxruntime" `
            engine.py
          cd ../..
          Copy-Item -Path "CapShorts/backend/dist/backend-engine.exe" -Destination "CapShorts/src-tauri/binaries/backend-engine.exe" -Force
          Write-Host "Standalone Windows backend engine ready!"

      # Compile Standalone Backend Engine (macOS)
      - name: Compile Backend Engine with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          cd CapShorts/backend
          pyinstaller --noconfirm --onefile --windowed \
            --name "backend-engine" \
            --hidden-import "uvicorn" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols" \
            --hidden-import "uvicorn.protocols.http" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.lifespan" \
            --hidden-import "uvicorn.lifespan.on" \
            --hidden-import "engine" \
            --hidden-import "broll" \
            --hidden-import "clip_generator" \
            --hidden-import "clip_scoring" \
            --hidden-import "groq_transcribe" \
            --hidden-import "subtitle_gen" \
            --hidden-import "transliterate" \
            --hidden-import "telemetry" \
            --hidden-import "text_align" \
            --hidden-import "asr_quality" \
            --hidden-import "file_utils" \
            --hidden-import "youtube_download" \
            --hidden-import "groq_chunks" \
            --hidden-import "animation_specs" \
            --hidden-import "emoji_overlay" \
            --hidden-import "reframe" \
            --hidden-import "media_store" \
            --hidden-import "parent_watch" \
            --collect-all "cv2" \
            --collect-submodules "yt_dlp" \
            --collect-all "yt_dlp_ejs" \
            --collect-all "faster_whisper" \
            --collect-all "ctranslate2" \
            --collect-all "onnxruntime" \
            engine.py
          cd ../..
          cp CapShorts/backend/dist/backend-engine CapShorts/src-tauri/binaries/backend-engine
          chmod +x CapShorts/src-tauri/binaries/backend-engine
          echo "Standalone macOS backend engine ready!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: CapShorts/src-tauri

      - name: Install frontend dependencies
        working-directory: CapShorts/frontend
        run: npm ci

      - name: Build Tauri app (${{ matrix.os_name }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: CapShorts
          args: ${{ runner.os == 'macOS' && '--target universal-apple-darwin' || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Kadr ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 Kadr ${{ github.ref_name }} — AI video editor for Shorts

            Standalone release for **Windows** and **macOS (Apple Silicon & Intel)**!

            ### ✨ Key Features
            - ⚡ **Auto Captions & Subtitles**: Word-accurate animated captions in 2-3 seconds with Groq Turbo Cloud.
            - ✂️ **Interactive Razor Tool**: Split video clips and subtitles instantly at playhead timestamp.
            - 🔇 **One-Click Dead Air Remover**: Automatic ripple-cut silence removal across all tracks.
            - 🎬 **AI Viral Shorts Detection**: Auto-detects 25-60s engaging clips with virality scores.
            - 🚀 **Hardware Accelerated Export**: NVENC, QuickSync, AMD AMF, and Apple VideoToolbox.
            - 📦 **Zero Dependencies**: Python AI daemon and FFmpeg are bundled directly inside the installer!

            ### 📥 Downloads
            - **Windows (Setup Installer)**: `Kadr_x64-setup.exe` / `Kadr_x64_en-US.msi`
            - **macOS (Universal - Apple Silicon & Intel)**: `Kadr_universal.dmg`
          releaseDraft: false
          prerelease: false
